# Publie automatiquement Studio Neige Paris sur GitHub Pages à chaque mise
# à jour de cette branche. Aucune action manuelle après la configuration
# initiale (voir README.md, section « Mettre le site en ligne »).
#
# Se déclenche sur claude/le-closet-ecommerce-7td2tx plutôt que sur "main" :
# ce dépôt ne possède pas de branche main, et sa branche par défaut héberge
# un projet distinct. Si ce site est un jour fusionné dans une branche
# main, ajoutez-la simplement à la liste ci-dessous.
name: Déployer sur GitHub Pages

on:
  push:
    branches: [claude/le-closet-ecommerce-7td2tx]
  # Permet aussi de relancer le déploiement manuellement depuis l'onglet Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les déploiements en attente sont annulés
# au profit du plus récent.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site (export statique)
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer le site généré
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
